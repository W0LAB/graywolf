name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Lets us manually exercise the cross-rs + GoReleaser pipeline on a
    # branch without cutting a release tag. Useful for verifying
    # cross-compile changes (e.g. the armv6 / hidapi linux-native-basic-udev
    # swap) before pushing a real tag and getting stuck in the retag dance.
    # GoReleaser will still run on the dispatched ref; it builds + packages
    # but won't upload because there's no associated tag.

permissions:
  contents: write
  packages: write

jobs:
  rust-build:
    name: Rust (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: amd64
            platform: linux
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            platform: linux
            use_cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            arch: arm
            platform: linux
            use_cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            arch: armv7
            platform: linux
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
            platform: windows
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ALSA + udev dev (Linux)
        if: matrix.platform == 'linux' && matrix.use_cross == false
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install cross (Linux arm64)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Compute version metadata
        id: ver
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          # Use a fixed 8-char prefix of the full SHA. `git rev-parse --short`
          # (and --short=N, which is only a *minimum*) lengthens the hash for
          # uniqueness based on object count and clone depth, so this
          # shallow-checkout job and the full-clone GoReleaser job could stamp
          # the same commit at different lengths (e.g. 7c309d4 vs 7c309d4e),
          # tripping the startup "versions disagree" check. A fixed prefix is a
          # pure function of the commit, independent of depth (graywolf#310).
          echo "commit=$(git rev-parse HEAD | cut -c1-8)" >> "$GITHUB_OUTPUT"

      # Run cargo/cross from the workspace root so cross-rs mounts the
      # whole repo (it needs access to ../proto/graywolf.proto, which is
      # shared with the Go side and sits outside the graywolf-modem crate
      # directory).
      - name: Build with cross
        if: matrix.use_cross
        env:
          GRAYWOLF_VERSION: ${{ steps.ver.outputs.version }}
          GRAYWOLF_GIT_COMMIT: ${{ steps.ver.outputs.commit }}
          # alsa-sys + libudev-sys go through pkg-config. When the host
          # arch != target arch, pkg-config-rs refuses to look anywhere
          # unless PKG_CONFIG_ALLOW_CROSS=1 is set; the per-target
          # PKG_CONFIG_PATH_<triple> var (note: underscores, NOT hyphens)
          # then tells pkg-config which multi-arch lib dir holds the
          # matching .pc files. The paths point inside the cross-rs
          # container after Cross.toml's pre-build installs the :arm64
          # or :armhf dev packages. v0.13.6 release initially failed
          # here -- pre-existing infra trap, not a code regression.
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: '/usr/lib/aarch64-linux-gnu/pkgconfig'
          PKG_CONFIG_PATH_arm_unknown_linux_gnueabihf: '/usr/lib/arm-linux-gnueabihf/pkgconfig'
          # armv7 shares the arm-linux-gnueabihf multi-arch dir with armv6;
          # only the per-triple var name differs (cross keys on the triple).
          PKG_CONFIG_PATH_armv7_unknown_linux_gnueabihf: '/usr/lib/arm-linux-gnueabihf/pkgconfig'
          # hidapi crate's bundled-source cc-rs compile needs libudev.h.
          # libudev-dev:<arch> installs the header at /usr/include/libudev.h
          # (Multi-Arch: same), but the cross-compiler's sysroot doesn't
          # include /usr/include by default.
          #
          # Use -idirafter (not -I): -I would put /usr/include AHEAD of
          # the cross sysroot's headers and pull in amd64-arch stdio.h
          # bits like bits/libc-header-start.h, which then breaks the
          # compile. -idirafter only consults /usr/include as a fallback,
          # so arch-specific headers stay sourced from the sysroot and
          # only the arch-independent libudev.h falls through.
          CFLAGS_aarch64_unknown_linux_gnu: '-idirafter /usr/include'
          CFLAGS_arm_unknown_linux_gnueabihf: '-idirafter /usr/include'
          CFLAGS_armv7_unknown_linux_gnueabihf: '-idirafter /usr/include'
        run: cross build --release --target ${{ matrix.target }} --bin graywolf-modem

      - name: Build with cargo
        if: matrix.use_cross == false
        env:
          GRAYWOLF_VERSION: ${{ steps.ver.outputs.version }}
          GRAYWOLF_GIT_COMMIT: ${{ steps.ver.outputs.commit }}
        run: cargo build --release --target ${{ matrix.target }} --bin graywolf-modem

      - name: Upload Rust binary (Unix)
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: rust-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/graywolf-modem
          retention-days: 1

      - name: Upload Rust binary (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v5
        with:
          name: rust-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/graywolf-modem.exe
          retention-days: 1

  frontend-build:
    name: Frontend (Vite + Svelte)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu
          npx vite build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 1

  # Native desktop app (cmd/graywolf-desktop, its own Go module). See
  # docs/wiki/build-pipelines.md. Windows cross-compiles (no cgo);
  # Linux needs cgo + WebKitGTK, built in Debian 12 so the binary's glibc
  # floor (2.36) covers Debian 12+, Ubuntu 22.04+ and current Fedora.
  desktop-windows:
    name: Desktop app (windows-amd64)
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: web/dist/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cmd/graywolf-desktop/go.mod
          cache-dependency-path: cmd/graywolf-desktop/go.sum

      - name: Compute version metadata
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # 4-part numeric for the Windows version resource: 0.15.0-beta.1 -> 0.15.0.0
          echo "numeric=${v%%-*}.0" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD | cut -c1-8)" >> "$GITHUB_OUTPUT"

      # Icon, manifest (Common Controls v6 for task dialogs, per-monitor
      # DPI) and version info, linked in via the generated .syso.
      - name: Generate Windows resources
        working-directory: cmd/graywolf-desktop
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 \
            --product-version "${{ steps.ver.outputs.numeric }}" --file-version "${{ steps.ver.outputs.numeric }}"
          ls -l *.syso

      - name: Build
        working-directory: cmd/graywolf-desktop
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -tags production \
            -ldflags "-s -w -H=windowsgui -X main.Version=${{ steps.ver.outputs.version }} -X main.GitCommit=${{ steps.ver.outputs.commit }}" \
            -o ../../graywolf-desktop.exe .

      - name: Upload desktop exe
        uses: actions/upload-artifact@v5
        with:
          name: desktop-windows-amd64
          path: graywolf-desktop.exe
          retention-days: 1

  desktop-linux:
    name: Desktop app (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: [rust-build, frontend-build]
    container: debian:bookworm
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config git ca-certificates curl \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Checkout
        uses: actions/checkout@v5

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: web/dist/

      - name: Download modem
        uses: actions/download-artifact@v5
        with:
          name: rust-linux-${{ matrix.arch }}
          path: dist-desktop/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: cmd/graywolf-desktop/go.mod
          cache-dependency-path: cmd/graywolf-desktop/go.sum

      - name: Compute version metadata
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: cmd/graywolf-desktop
        run: go vet -tags gtk3 ./... && go test -tags gtk3 ./...

      - name: Build
        working-directory: cmd/graywolf-desktop
        env:
          CGO_ENABLED: '1'
        run: |
          go build -trimpath -tags gtk3,production \
            -ldflags "-s -w -X main.Version=${{ steps.ver.outputs.version }} -X main.GitCommit=${{ steps.ver.outputs.commit }}" \
            -o ../../dist-desktop/graywolf-desktop .
          chmod +x ../../dist-desktop/graywolf-desktop ../../dist-desktop/graywolf-modem

      - name: Package (deb, rpm, tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.0
          v="${{ steps.ver.outputs.version }}"
          sed -e "s/@VERSION@/$v/" -e "s/@ARCH@/${{ matrix.arch }}/" packaging/desktop/nfpm.yaml.in > nfpm-desktop.yaml
          mkdir -p out
          "$(go env GOPATH)/bin/nfpm" package --config nfpm-desktop.yaml --packager deb --target out/
          "$(go env GOPATH)/bin/nfpm" package --config nfpm-desktop.yaml --packager rpm --target out/
          case "${{ matrix.arch }}" in amd64) a=x86_64 ;; *) a="${{ matrix.arch }}" ;; esac
          t="graywolf-desktop_${v}_linux_${a}"
          mkdir -p "$t"
          cp dist-desktop/graywolf-desktop dist-desktop/graywolf-modem LICENSE "$t/"
          cp packaging/desktop/graywolf-desktop.desktop packaging/desktop/70-graywolf-desktop.rules "$t/"
          cp packaging/desktop/icons/graywolf-256.png "$t/graywolf.png"
          tar -czf "out/$t.tar.gz" "$t"
          ls -l out/

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: out/*
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 7 || 1 }}

  desktop-publish:
    name: Publish desktop packages
    runs-on: ubuntu-latest
    needs: [release, desktop-linux]
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Download Linux desktop packages
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-linux-*
          merge-multiple: true
          path: out/

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          sha256sum * > checksums-desktop.txt
          gh release upload "${{ github.ref_name }}" * --clobber --repo "${{ github.repository }}"

  release:
    name: GoReleaser (Go + Docker + Packages)
    runs-on: ubuntu-latest
    needs: [rust-build, frontend-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Stamp the Go binary with the same fixed 8-char SHA prefix the Rust
      # modem build uses. GoReleaser's {{.ShortCommit}} is git's variable
      # abbreviation, whose length tracks clone depth -- a fixed prefix here
      # keeps both binaries' version strings byte-identical (graywolf#310).
      - name: Compute version metadata
        id: ver
        shell: bash
        run: echo "commit=$(git rev-parse HEAD | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Download frontend dist
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: web/dist/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Render the GitHub release body from the curated notes.yaml entry so
      # it matches the in-app "What's new" -- and so GoReleaser does not fall
      # back to listing every commit when the previous release tag is not an
      # ancestor of the tagged commit. Written to RUNNER_TEMP (outside the
      # work tree) so it neither dirties git nor gets wiped by --clean.
      - name: Render release notes from notes.yaml
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          go run ./cmd/release-notes -version "$v" -out "$RUNNER_TEMP/release-notes.md"
          echo "---- release notes ----"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all Rust binaries
        uses: actions/download-artifact@v5
        with:
          path: rust-artifacts/
          pattern: rust-*

      - name: Arrange Rust binaries for GoReleaser
        run: |
          mkdir -p rust-bin/{linux_amd64,linux_arm64,linux_arm,linux_armv7,windows_amd64}
          cp rust-artifacts/rust-linux-amd64/graywolf-modem       rust-bin/linux_amd64/
          cp rust-artifacts/rust-linux-arm64/graywolf-modem       rust-bin/linux_arm64/
          cp rust-artifacts/rust-linux-arm/graywolf-modem         rust-bin/linux_arm/
          # armv7 (NEON) modem -- kept distinct from the armv6 linux_arm
          # build so the goarm=7 archive/package bundle the optimized binary.
          cp rust-artifacts/rust-linux-armv7/graywolf-modem       rust-bin/linux_armv7/
          cp rust-artifacts/rust-windows-amd64/graywolf-modem.exe rust-bin/windows_amd64/
          chmod +x rust-bin/*/graywolf-modem || true
          # Flat copies for Docker builds (extra_files path is preserved in context)
          cp rust-bin/linux_amd64/graywolf-modem graywolf-modem-amd64
          cp rust-bin/linux_arm64/graywolf-modem graywolf-modem-arm64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          # On a tag push we cut a real release; on workflow_dispatch we
          # run in snapshot mode so the build pipeline executes end-to-end
          # without needing a tag context (no upload, no draft release).
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || format('release --clean --release-notes={0}/release-notes.md', runner.temp) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAYWOLF_GIT_COMMIT: ${{ steps.ver.outputs.commit }}

      - name: Upload Windows binary for installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-amd64-binary
          path: dist/graywolf_windows_amd64_v1/graywolf.exe
          retention-days: 1

      # On workflow_dispatch (snapshot mode) the produced .deb/.rpm/.tar.gz
      # would otherwise evaporate with the runner. Upload them so we can
      # download and test the artifacts on real hardware (e.g. Pi 5) before
      # cutting a real release tag.
      - name: Upload snapshot packages (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: snapshot-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7

  installer:
    name: Windows Installer
    runs-on: windows-latest
    needs: [release, desktop-windows]
    # On workflow_dispatch the ref is a branch name, so the version comes
    # from the VERSION file and the installer is kept as a workflow
    # artifact instead of being attached to a release.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Windows Go binary
        uses: actions/download-artifact@v5
        with:
          name: windows-amd64-binary
          path: bin

      - name: Download Windows Rust binary
        uses: actions/download-artifact@v5
        with:
          name: rust-windows-amd64
          path: modem-bin

      - name: Download Windows desktop exe
        uses: actions/download-artifact@v5
        with:
          name: desktop-windows-amd64
          path: desktop-bin

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      # Evergreen bootstrapper (small; downloads the runtime only when the
      # installer finds WebView2 missing). Redistributable per Microsoft.
      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "MicrosoftEdgeWebview2Setup.exe"
          $sig = Get-AuthenticodeSignature "MicrosoftEdgeWebview2Setup.exe"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "WebView2 bootstrapper signature check failed: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      - name: Build installer
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $fullVersion = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $fullVersion = (Get-Content VERSION -Raw).Trim()
          }
          # VIProductVersion needs a 4-part numeric version; strip any pre-release suffix
          $numeric = ($fullVersion -split '-')[0] + ".0"
          $binaryPath = (Resolve-Path "bin/graywolf.exe").Path
          $modemPath  = (Resolve-Path "modem-bin/graywolf-modem.exe").Path
          $desktopPath = (Resolve-Path "desktop-bin/graywolf-desktop.exe").Path
          $webview2   = (Resolve-Path "MicrosoftEdgeWebview2Setup.exe").Path
          $outFile    = "graywolf_${fullVersion}_Windows_x86_64.exe"
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DAPP_VERSION=$fullVersion" `
            "/DAPP_VERSION_NUMERIC=$numeric" `
            "/DBINARY_PATH=$binaryPath" `
            "/DMODEM_PATH=$modemPath" `
            "/DDESKTOP_PATH=$desktopPath" `
            "/DWEBVIEW2_BOOTSTRAPPER=$webview2" `
            "/DOUTFILE=$outFile" `
            packaging/nsis/graywolf.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

      - name: Upload installer artifact (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: packaging/nsis/graywolf_*_Windows_x86_64.exe
          retention-days: 7

      - name: Upload installer to release
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          gh release upload "${{ github.ref_name }}" "packaging/nsis/graywolf_${VERSION}_Windows_x86_64.exe" --clobber
